<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drawn Charts</title>
  <!--
    Test fixture: charts drawn without a chart library, in the styles AI tools
    commonly produce. Every chart has known values so the import can be checked.
  -->
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 24px; }
    .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .card h2 { font-size: 15px; margin: 0 0 10px; }
    svg text { font-size: 11px; fill: #64748b; }
    .donut { width: 160px; height: 160px; border-radius: 50%; position: relative; margin: 0 auto;
             background: conic-gradient(#2563eb 0 50%, #f59e0b 50% 80%, #10b981 80% 100%); }
    .donut::after { content: ''; position: absolute; inset: 35px; background: #fff; border-radius: 50%; }
    .legend { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; font-size: 12px; }
    .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
    .row { margin: 8px 0; font-size: 12px; }
    .track { height: 10px; background: #e2e8f0; border-radius: 5px; margin-top: 4px; }
    .fill { height: 10px; border-radius: 5px; background: #6366f1; }
    .cols { display: flex; align-items: flex-end; gap: 18px; height: 160px; padding: 0 10px; }
    .col { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; }
    .col .bar { width: 34px; background: #0ea5e9; }
  </style>
</head>
<body>
  <div class="grid">
    <!-- 1. SVG bars with a y axis (0–400) → values 100, 250, 400 -->
    <div class="card">
      <h2>Orders by Region</h2>
      <svg width="320" height="220">
        <text x="0" y="204">0</text><text x="0" y="129">200</text><text x="0" y="54">400</text>
        <rect x="40" y="162.5" width="50" height="37.5" fill="#2563eb"></rect>
        <rect x="120" y="106.25" width="50" height="93.75" fill="#2563eb"></rect>
        <rect x="200" y="50" width="50" height="150" fill="#2563eb"></rect>
        <text x="55" y="216">North</text><text x="135" y="216">South</text><text x="218" y="216">West</text>
      </svg>
    </div>
    <!-- 2. Rounded path bars (Recharts style) + line path with curves, y axis 0–100 -->
    <div class="card">
      <h2>Visits and Conversion</h2>
      <svg width="320" height="220">
        <text x="0" y="204">0</text><text x="0" y="104">50</text><text x="0" y="4" dy="8">100</text>
        <path d="M40,200 L40,124 A4,4 0 0 1 44,120 L76,120 A4,4 0 0 1 80,124 L80,200 Z" fill="#7c3aed"></path>
        <path d="M120,200 L120,84 A4,4 0 0 1 124,80 L156,80 A4,4 0 0 1 160,84 L160,200 Z" fill="#7c3aed"></path>
        <path d="M200,200 L200,44 A4,4 0 0 1 204,40 L236,40 A4,4 0 0 1 240,44 L240,200 Z" fill="#7c3aed"></path>
        <path d="M60,160 C90,150 110,150 140,140 C170,130 190,120 220,100" fill="none" stroke="#f43f5e" stroke-width="2"></path>
        <text x="50" y="216">Jan</text><text x="130" y="216">Feb</text><text x="210" y="216">Mar</text>
      </svg>
    </div>
    <!-- 3. SVG pie from arc paths: 25% / 75% -->
    <div class="card">
      <h2>Channel Split</h2>
      <svg width="220" height="200">
        <path d="M100,100 L100,20 A80,80 0 0 1 180,100 Z" fill="#ef4444"></path>
        <path d="M100,100 L180,100 A80,80 0 1 1 100,20 Z" fill="#22c55e"></path>
        <rect x="190" y="20" width="10" height="10" fill="#ef4444"></rect><text x="204" y="29">Web</text>
        <rect x="190" y="40" width="10" height="10" fill="#22c55e"></rect><text x="204" y="49">Store</text>
      </svg>
    </div>
    <!-- 4. Donut from dashed circles: 60 / 40 -->
    <div class="card">
      <h2>Ticket Status</h2>
      <svg width="200" height="200" viewBox="0 0 42 42">
        <circle cx="21" cy="21" r="15.915" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-dasharray="60 40"></circle>
        <circle cx="21" cy="21" r="15.915" fill="none" stroke="#f97316" stroke-width="5" stroke-dasharray="40 60" stroke-dashoffset="-60"></circle>
        <text x="16" y="23">Mix</text>
      </svg>
    </div>
    <!-- 5. CSS conic-gradient donut with a legend carrying the values -->
    <div class="card">
      <h2>Budget Allocation</h2>
      <div class="donut"></div>
      <div class="legend">
        <div><span class="sw" style="background:#2563eb"></span>Marketing 50%</div>
        <div><span class="sw" style="background:#f59e0b"></span>Sales 30%</div>
        <div><span class="sw" style="background:#10b981"></span>R&amp;D 20%</div>
      </div>
    </div>
    <!-- 6. CSS progress bars: 80%, 55%, 30% of the track -->
    <div class="card">
      <h2>Goal Completion</h2>
      <div class="row">Onboarding<div class="track"><div class="fill" style="width:80%"></div></div></div>
      <div class="row">Training<div class="track"><div class="fill" style="width:55%"></div></div></div>
      <div class="row">Certification<div class="track"><div class="fill" style="width:30%"></div></div></div>
    </div>
    <!-- 7. Vertical CSS bars with value labels -->
    <div class="card">
      <h2>Weekly Signups</h2>
      <div class="cols">
        <div class="col"><span>120</span><div class="bar" style="height:60px"></div><span>W1</span></div>
        <div class="col"><span>240</span><div class="bar" style="height:120px"></div><span>W2</span></div>
        <div class="col"><span>180</span><div class="bar" style="height:90px"></div><span>W3</span></div>
      </div>
    </div>
  </div>
</body>
</html>
